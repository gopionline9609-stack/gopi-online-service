<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOPI ONLINE SERVICE</title>

<meta name="theme-color" content="#030712">
<meta name="description" content="GOPI ONLINE SERVICE - Professional Online Services">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

:root{

    --bg:#02040a;

    --blue:#2588ff;
    --blue2:#00b7ff;
    --cyan:#55e7ff;

    --white:#ffffff;
    --text:#f5f9ff;
    --muted:#8190a7;

    --glass:rgba(255,255,255,.055);
    --glass-border:rgba(130,190,255,.16);

    --shadow:
        0 40px 100px rgba(0,0,0,.75),
        0 0 70px rgba(20,120,255,.08);
}

html{
    width:100%;
    min-height:100%;
    scroll-behavior:smooth;
}

body{

    width:100%;
    min-height:100vh;

    overflow-x:hidden;

    color:var(--text);

    background:

        radial-gradient(
            circle at 20% 10%,
            rgba(0,120,255,.16),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 75%,
            rgba(0,210,255,.12),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 50%,
            rgba(50,70,180,.06),
            transparent 45%
        ),

        linear-gradient(
            145deg,
            #01030a,
            #040b18 50%,
            #01030a
        );

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

    isolation:isolate;
}


/* =========================================================
   CINEMATIC BACKGROUND
========================================================= */

body::before{

    content:"";

    position:fixed;
    inset:0;

    z-index:-5;

    background-image:

        linear-gradient(
            rgba(100,170,255,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(100,170,255,.025) 1px,
            transparent 1px
        );

    background-size:50px 50px;

    mask-image:
        radial-gradient(
            circle at center,
            black,
            transparent 82%
        );

    pointer-events:none;
}


/* cinematic vignette */

body::after{

    content:"";

    position:fixed;
    inset:0;

    z-index:20;

    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            transparent 35%,
            rgba(0,0,0,.42) 100%
        );

}


/* =========================================================
   AURORA
========================================================= */

.aurora{

    position:fixed;

    width:600px;
    height:600px;

    border-radius:50%;

    filter:blur(100px);

    opacity:.12;

    pointer-events:none;

    z-index:-4;
}

.aurora.one{

    left:-280px;
    top:-260px;

    background:
        radial-gradient(
            circle,
            #1675ff,
            transparent 70%
        );

    animation:
        auroraOne 14s ease-in-out infinite alternate;
}

.aurora.two{

    right:-300px;
    bottom:-280px;

    background:
        radial-gradient(
            circle,
            #00cfff,
            transparent 70%
        );

    animation:
        auroraTwo 17s ease-in-out infinite alternate;
}

.aurora.three{

    width:380px;
    height:380px;

    left:45%;
    top:35%;

    opacity:.055;

    background:
        radial-gradient(
            circle,
            #436cff,
            transparent 70%
        );

    animation:
        auroraThree 12s ease-in-out infinite alternate;
}

@keyframes auroraOne{

    0%{
        transform:translate(0,0) scale(1);
    }

    100%{
        transform:translate(230px,160px) scale(1.25);
    }
}

@keyframes auroraTwo{

    0%{
        transform:translate(0,0) scale(1);
    }

    100%{
        transform:translate(-220px,-150px) scale(1.3);
    }
}

@keyframes auroraThree{

    0%{
        transform:translate(-80px,50px) scale(.8);
    }

    100%{
        transform:translate(100px,-80px) scale(1.2);
    }
}


/* =========================================================
   PARTICLES
========================================================= */

.particles{

    position:fixed;
    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:-2;
}

.particle{

    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#b8e6ff;

    box-shadow:
        0 0 6px #4aaaff,
        0 0 16px rgba(50,150,255,.8);

    opacity:0;

    animation:
        particleFloat linear infinite;
}

@keyframes particleFloat{

    from {
        transform: translate(0, 110vh) scale(.2);
        opacity: 0;
    }

    12% {
        opacity: .8;
    }

    55% {
        opacity: .55;
    }

    to {
        transform: translate(80px, -15vh) scale(1.6);
        opacity: 0;
    }
}


/* =========================================================
   CINEMATIC TOP LINE
========================================================= */

.scan-line{

    position:fixed;

    left:0;
    top:-10%;

    width:100%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(80,180,255,.35),
            transparent
        );

    box-shadow:
        0 0 20px rgba(50,150,255,.25);

    pointer-events:none;

    z-index:15;

    animation:
        scanLine 9s linear infinite;
}

@keyframes scanLine{

    0%{
        top:-10%;
        opacity:0;
    }

    10%{
        opacity:1;
    }

    90%{
        opacity:.7;
    }

    100%{
        top:110%;
        opacity:0;
    }
}


/* =========================================================
   MAIN
========================================================= */

.container{

    width:min(92%,470px);

    padding:
        28px 0
        calc(28px + env(safe-area-inset-bottom));

    position:relative;

    z-index:10;

    animation:
        pageEnter 1.1s cubic-bezier(.16,1,.3,1);

    transform-style:preserve-3d;
}

@keyframes pageEnter{

    from{

        opacity:0;

        transform:
            translateY(55px)
            scale(.92);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   BRAND
========================================================= */

.brand{

    text-align:center;

    margin-bottom:27px;

    position:relative;

    z-index:3;
}

.logo-wrap{

    width:88px;
    height:88px;

    margin:auto;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    transform-style:preserve-3d;

    animation:
        logoFloat 5s ease-in-out infinite;
}

@keyframes logoFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-6px);
    }
}


/* rotating energy ring */

.logo-ring{

    position:absolute;

    inset:0;

    border-radius:28px;

    background:

        conic-gradient(
            from 0deg,
            transparent 0deg,
            #0b66ff 55deg,
            #55e7ff 120deg,
            transparent 180deg,
            #277eff 250deg,
            transparent 330deg
        );

    animation:
        rotateLogo 4s linear infinite;

    filter:
        drop-shadow(
            0 0 9px rgba(35,140,255,.8)
        );

}

.logo-ring::before{

    content:"";

    position:absolute;

    inset:2px;

    border-radius:26px;

    background:#06101e;
}

@keyframes rotateLogo{

    to{
        transform:rotate(360deg);
    }
}


/* inner logo */

.logo{

    width:69px;
    height:69px;

    border-radius:22px;

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:25px;
    font-weight:950;

    letter-spacing:-1px;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.17),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(170,220,255,.35);

    box-shadow:

        inset 0 0 30px rgba(50,150,255,.12),

        0 0 25px rgba(30,120,255,.2),

        0 0 70px rgba(20,110,255,.12);

    animation:
        logoPulse 3.2s ease-in-out infinite;
}

@keyframes logoPulse{

    0%,100%{

        box-shadow:
            inset 0 0 25px rgba(50,150,255,.1),
            0 0 25px rgba(30,120,255,.18);
    }

    50%{

        box-shadow:
            inset 0 0 40px rgba(50,150,255,.22),
            0 0 48px rgba(30,120,255,.4);
    }
}


/* brand title */

.brand h1{

    margin-top:18px;

    font-size:
        clamp(21px,6vw,29px);

    font-weight:850;

    letter-spacing:2px;

    background:

        linear-gradient(
            90deg,
            #fff,
            #9bd5ff,
            #fff,
            #55b5ff,
            #fff
        );

    background-size:350% auto;

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;

    animation:
        titleShine 6s linear infinite;
}

@keyframes titleShine{

    to{
        background-position:350% center;
    }
}

.brand p{

    margin-top:7px;

    color:#718198;

    font-size:10px;

    letter-spacing:2.4px;

    text-transform:uppercase;
}


/* =========================================================
   AUTH CARD
========================================================= */

.auth-card{

    position:relative;

    padding:32px 29px;

    border-radius:30px;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.085),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(120,185,255,.17);

    backdrop-filter:
        blur(30px)
        saturate(130%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(130%);

    box-shadow:

        0 40px 100px rgba(0,0,0,.75),

        inset 0 1px 0 rgba(255,255,255,.10),

        inset 0 -1px 0 rgba(255,255,255,.025),

        0 0 70px rgba(30,120,255,.07);

    overflow:hidden;

    transform-style:preserve-3d;

    transition:
        transform .25s ease,
        border-color .4s ease,
        box-shadow .4s ease;
}

.auth-card:hover{

    border-color:
        rgba(100,180,255,.24);

    box-shadow:

        0 45px 110px rgba(0,0,0,.8),

        inset 0 1px 0 rgba(255,255,255,.11),

        0 0 90px rgba(30,130,255,.1);
}


/* internal light */

.auth-card::before{

    content:"";

    position:absolute;

    width:280px;
    height:280px;

    left:-180px;
    top:-170px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(40,150,255,.2),
            transparent 70%
        );

    pointer-events:none;

    animation:
        cardAura 9s ease-in-out infinite alternate;
}

@keyframes cardAura{

    100%{
        transform:
            translate(520px,540px)
            scale(1.4);
    }
}


/* top moving light */

.top-light{

    position:absolute;

    top:0;
    left:-100%;

    width:70%;
    height:1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #a7ddff,
            transparent
        );

    box-shadow:
        0 0 16px #3ea6ff;

    animation:
        topLight 4.5s linear infinite;

    pointer-events:none;
}

@keyframes topLight{

    0%{
        left:-100%;
    }

    100%{
        left:150%;
    }
}


/* =========================================================
   TABS
========================================================= */

.tabs{

    display:flex;

    gap:7px;

    padding:5px;

    margin-bottom:25px;

    border-radius:16px;

    background:
        rgba(0,0,0,.28);

    border:
        1px solid rgba(255,255,255,.055);

    position:relative;

    z-index:50;
}

.tab{

    flex:1;

    border:0;

    padding:12px;

    border-radius:11px;

    color:#718198;

    background:transparent;

    font-size:13px;

    font-weight:750;

    cursor:pointer;

    transition:
        color .3s ease,
        background .35s ease,
        transform .25s ease,
        box-shadow .35s ease;

    position:relative;

    z-index:51;

    -webkit-tap-highlight-color:transparent;
}

.tab:hover{

    color:#eaf5ff;

    background:
        rgba(255,255,255,.025);
}

.tab.active{

    color:#fff;

    background:

        linear-gradient(
            135deg,
            #318cff,
            #1558d3
        );

    box-shadow:

        0 9px 28px rgba(25,105,240,.3),

        inset 0 1px 0 rgba(255,255,255,.28);

    transform:
        translateY(-1px);
}


/* =========================================================
   FORMS
========================================================= */

.form{

    animation:
        formReveal .45s cubic-bezier(.16,1,.3,1);
}

@keyframes formReveal{

    from{

        opacity:0;

        transform:
            translateY(14px)
            scale(.985);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}

.hidden{
    display:none !important;
}

.form-title{

    font-size:23px;

    font-weight:800;

    margin-bottom:7px;

    letter-spacing:-.3px;
}

.form-subtitle{

    color:#7d8da4;

    font-size:13px;

    margin-bottom:22px;
}


/* =========================================================
   LOGIN TYPE
========================================================= */

.login-type{

    display:flex;

    gap:7px;

    padding:5px;

    margin-bottom:18px;

    border-radius:15px;

    background:
        rgba(0,0,0,.25);

    border:
        1px solid rgba(255,255,255,.05);
}

.type-btn{

    flex:1;

    border:0;

    padding:10px 7px;

    border-radius:10px;

    color:#718198;

    background:transparent;

    font-size:11px;

    font-weight:750;

    cursor:pointer;

    transition:
        .3s ease;
}

.type-btn:hover{

    color:#ddecff;
}

.type-btn.active{

    color:#fff;

    background:

        linear-gradient(
            135deg,
            rgba(45,135,255,.95),
            rgba(17,82,195,.95)
        );

    box-shadow:

        0 6px 20px rgba(24,105,255,.23),

        inset 0 1px 0 rgba(255,255,255,.25);
}


/* =========================================================
   INPUT
========================================================= */

.input-group{

    margin-bottom:16px;
}

.input-group label{

    display:block;

    margin-bottom:8px;

    color:#a8b5c8;

    font-size:12px;

    font-weight:650;
}

.input-box{

    position:relative;
}

.input-box input{

    width:100%;

    padding:15px 15px;

    border-radius:14px;

    border:
        1px solid rgba(130,180,255,.11);

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(0,0,0,.20)
        );

    color:#fff;

    outline:none;

    font-size:14px;

    transition:

        border-color .3s ease,
        box-shadow .3s ease,
        transform .25s ease,
        background .3s ease;
}

.input-box input::placeholder{

    color:#526177;
}

.input-box input:hover{

    border-color:
        rgba(120,180,255,.2);
}

.input-box input:focus{

    border-color:
        rgba(70,160,255,.68);

    background:
        rgba(20,45,80,.22);

    box-shadow:

        0 0 0 3px rgba(30,120,255,.055),

        0 0 25px rgba(30,120,255,.13);

    transform:
        translateY(-1px);
}


/* password */

.password-box input{

    padding-right:50px !important;
}

.password-toggle{

    position:absolute;

    right:11px;
    top:50%;

    transform:
        translateY(-50%);

    border:0;

    background:transparent;

    color:#79a5d5;

    font-size:17px;

    cursor:pointer;

    padding:6px;

    transition:
        .25s ease;

    z-index:5;
}

.password-toggle:hover{

    color:#fff;

    transform:
        translateY(-50%)
        scale(1.12);
}


/* =========================================================
   MAIN BUTTON
========================================================= */

.main-btn{

    width:100%;

    margin-top:4px;

    padding:15px;

    min-height:50px;

    border:0;

    border-radius:15px;

    position:relative;

    overflow:hidden;

    cursor:pointer;

    color:#fff;

    font-size:14px;

    font-weight:800;

    letter-spacing:.2px;

    background:

        linear-gradient(
            110deg,
            #0d4fc4,
            #3192ff,
            #0d65e9,
            #174ca7
        );

    background-size:280% auto;

    box-shadow:

        0 10px 30px rgba(20,105,240,.28),

        inset 0 1px 0 rgba(255,255,255,.28);

    animation:
        buttonGradient 5s linear infinite;

    transition:
        transform .25s ease,
        box-shadow .3s ease,
        filter .25s ease;

    -webkit-tap-highlight-color:transparent;
}

@keyframes buttonGradient{

    to{
        background-position:280% center;
    }
}

.main-btn:hover{

    transform:
        translateY(-3px);

    box-shadow:

        0 17px 43px rgba(20,105,240,.42),

        0 0 30px rgba(40,140,255,.15),

        inset 0 1px 0 rgba(255,255,255,.3);

    filter:
        brightness(1.08);
}

.main-btn:active{

    transform:
        translateY(0)
        scale(.98);
}

.main-btn::before{

    content:"";

    position:absolute;

    pointer-events:none;

    position:absolute;

    top:0;
    left:-120%;

    width:65%;
    height:100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.55),
            transparent
        );

    transform:
        skewX(-20deg);

    animation:
        buttonSweep 3.2s ease-in-out infinite;
}

@keyframes buttonSweep{

    0%,45%{
        left:-120%;
    }

    100%{
        left:150%;
    }
}

.main-btn.loading{

    pointer-events:none;

    opacity:.82;
}

.main-btn.loading::after{

    content:"";

    width:16px;
    height:16px;

    border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;

    border-radius:50%;

    display:inline-block;

    vertical-align:middle;

    margin-left:8px;

    animation:
        spin .7s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   FOOTER
========================================================= */

.footer-info{

    text-align:center;

    margin-top:22px;

    color:#617087;

    font-size:11px;

    line-height:1.9;
}

.footer-info strong{

    color:#a9d6ff;

    font-weight:650;
}

.copyright{

    text-align:center;

    margin-top:12px;

    color:#3d4b5f;

    font-size:10px;
}


/* =========================================================
   TOAST
========================================================= */

.toast-container{

    position:fixed;

    top:20px;
    left:50%;

    transform:
        translateX(-50%);

    width:min(92%,430px);

    z-index:9999;

    pointer-events:none;
}

.toast{

    display:flex;

    align-items:center;

    gap:11px;

    padding:13px 15px;

    border-radius:15px;

    background:
        rgba(5,12,25,.82);

    border:
        1px solid rgba(110,180,255,.2);

    backdrop-filter:
        blur(20px);

    box-shadow:
        0 20px 50px rgba(0,0,0,.55),
        0 0 35px rgba(30,120,255,.1);

    color:#fff;

    font-size:12px;

    opacity:0;

    transform:
        translateY(-20px)
        scale(.96);

    animation:
        toastIn .4s cubic-bezier(.16,1,.3,1)
        forwards;
}

.toast.success{
    border-color:
        rgba(50,220,150,.3);
}

.toast.error{
    border-color:
        rgba(255,80,100,.3);
}

.toast-icon{

    width:28px;
    height:28px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(50,150,255,.14);

    flex-shrink:0;
}

.toast.success .toast-icon{

    background:
        rgba(40,220,140,.13);
}

.toast.error .toast-icon{

    background:
        rgba(255,70,90,.13);
}

@keyframes toastIn{

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}

.toast.hide{

    animation:
        toastOut .3s ease forwards;
}

@keyframes toastOut{

    to{

        opacity:0;

        transform:
            translateY(-15px)
            scale(.96);
    }
}


/* =========================================================
   MOBILE
========================================================= */

button,
input{

    -webkit-tap-highlight-color:transparent;
}

button{

    touch-action:manipulation;
}

@media(max-width:480px){

    body{

        min-height:100svh;

        align-items:flex-start;
    }

    .container{

        width:92%;

        padding:
            max(18px,env(safe-area-inset-top))
            0
            calc(25px + env(safe-area-inset-bottom));
    }

    .auth-card{

        padding:25px 19px;

        border-radius:24px;
    }

    .logo-wrap{

        width:75px;
        height:75px;
    }

    .logo{

        width:59px;
        height:59px;

        border-radius:19px;

        font-size:21px;
    }

    .brand h1{

        font-size:20px;

        letter-spacing:1.5px;
    }

    .brand p{

        font-size:9px;

        letter-spacing:1.5px;
    }

    .form-title{

        font-size:21px;
    }

    .input-box input{

        min-height:49px;

        padding:14px;

        font-size:16px;
    }

    .main-btn{

        min-height:48px;

        padding:14px;
    }

    .tab{

        min-height:46px;
    }

    .type-btn{

        min-height:44px;

        font-size:10.5px;
    }

    .footer-info{

        font-size:10px;
    }
}

@media(max-width:350px){

    .container{

        width:94%;
    }

    .auth-card{

        padding:22px 16px;
    }

    .brand h1{

        font-size:18px;
    }

    .form-title{

        font-size:19px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

/* =========================================================
   PARTICLES
========================================================= */

const particleContainer =
    document.getElementById("particles");

function createParticles(){

    const count =
        window.innerWidth < 600
        ? 18
        : 34;

    for(let i = 0; i < count; i++){

        const particle =
            document.createElement("span");

        particle.className =
            "particle";

        particle.style.left =
            Math.random() * 100 + "%";

        particle.style.animationDuration =
            (7 + Math.random() * 9) + "s";

        particle.style.animationDelay =
            (-Math.random() * 12) + "s";

        const size =
            1 + Math.random() * 2.5;

        particle.style.width =
            size + "px";

        particle.style.height =
            size + "px";

        particleContainer.appendChild(
            particle
        );
    }
}

createParticles();


/* =========================================================
   TOAST SYSTEM
========================================================= */

function showToast(
    message,
    type = "success",
    duration = 4000
){

    const container =
        document.getElementById(
            "toastContainer"
        );

    const toast =
        document.createElement("div");

    toast.className =
        "toast " + type;

    const icon =
        type === "success"
        ? "✓"
        : "!"

    toast.innerHTML = `

        <div class="toast-icon">
            ${icon}
        </div>

        <div>
            ${message}
        </div>

    `;

    container.appendChild(toast);

    setTimeout(() => {

        toast.classList.add("hide");

        setTimeout(() => {

            toast.remove();

        }, 300);

    }, duration);
}


/* =========================================================
   BUTTON LOADING
========================================================= */

function setButtonLoading(
    button,
    loading,
    loadingText = "Processing..."
){

    if(!button) return;

    if(loading){

        button.dataset.originalText =
            button.textContent;

        button.textContent =
            loadingText;

        button.classList.add("loading");

    }else{

        button.textContent =
            button.dataset.originalText ||
            button.textContent;

        button.classList.remove("loading");
    }
}


/* =========================================================
   REGISTER
========================================================= */

async function registerUser(){

    const button =
        document.getElementById(
            "createAccountBtn"
        );

    const name =
        document
            .getElementById("registerName")
            .value
            .trim();

    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();

    const phone =
        document
            .getElementById("registerPhone")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;


    if(!name || !email || !phone || !password){

        showToast(
            "Please fill all fields.",
            "error"
        );

        return;
    }


    if(!/^\d{10}$/.test(phone)){

        showToast(
            "Please enter a valid 10-digit mobile number.",
            "error"
        );

        return;
    }


    if(password.length < 6){

        showToast(
            "Password must be at least 6 characters.",
            "error"
        );

        return;
    }


    try{

        setButtonLoading(
            button,
            true,
            "Creating Account..."
        );


        const { data, error } =
            await supabase.auth.signUp({

                email:email,

                password:password,

                options:{
                    data:{
                        full_name:name
                    }
                }

            });


        if(error){

            showToast(
                error.message,
                "error",
                5000
            );

            return;
        }


        sessionStorage.setItem(
            "register_email",
            email
        );

        sessionStorage.setItem(
            "register_name",
            name
        );


        document
            .getElementById(
                "registerOTPBox"
            )
            .classList.remove("hidden");


        document
            .getElementById(
                "registerOTP"
            )
            .focus();


        showToast(
            "OTP sent successfully. Check your email inbox.",
            "success",
            5000
        );


    }catch(err){

        console.error(err);

        showToast(
            err.message ||
            "Something went wrong.",
            "error"
        );

    }finally{

        setButtonLoading(
            button,
            false
        );
    }
}


/* =========================================================
   VERIFY REGISTER OTP
========================================================= */

async function verifyRegisterOTP(){

    const button =
        document.getElementById(
            "verifyRegisterBtn"
        );

    const email =
        sessionStorage.getItem(
            "register_email"
        ) ||
        document
            .getElementById(
                "registerEmail"
            )
            .value
            .trim();

    const otp =
        document
            .getElementById(
                "registerOTP"
            )
            .value
            .trim();


    if(!email){

        showToast(
            "Email address not found. Please register again.",
            "error"
        );

        return;
    }


    if(!/^\d{6}$/.test(otp)){

        showToast(
            "Please enter the 6-digit OTP.",
            "error"
        );

        return;
    }


    try{

        setButtonLoading(
            button,
            true,
            "Verifying..."
        );


        const { data, error } =
            await supabase.auth.verifyOtp({

                email:email,

                token:otp,

                type:"email"

            });


        if(error){

            showToast(
                "OTP verification failed: " +
                error.message,
                "error",
                5000
            );

            return;
        }


        if(data.session && data.user){

            showToast(
                "Email verified successfully! Your account is ready.",
                "success",
                5000
            );


            sessionStorage.removeItem(
                "register_email"
            );

            sessionStorage.removeItem(
                "register_name"
            );


            setTimeout(() => {

                showLogin();

                document
                    .getElementById(
                        "loginEmail"
                    )
                    .value = email;

                document
                    .getElementById(
                        "registerOTPBox"
                    )
                    .classList.add("hidden");

            },700);

        }

    }catch(err){

        console.error(err);

        showToast(
            err.message ||
            "Verification error.",
            "error"
        );

    }finally{

        setButtonLoading(
            button,
            false
        );
    }
}

/* =========================================================

function initializeUI(){

    const loginTab =
        document.getElementById("loginTab");

    const registerTab =
        document.getElementById("registerTab");

    const emailType =
        document.getElementById("emailType");

    const phoneType =
        document.getElementById("phoneType");

    const sendOtpBtn =
        document.getElementById("sendOtpBtn");

    const verifyOtpBtn =
        document.getElementById("verifyOtpBtn");

    const createAccountBtn =
        document.getElementById("createAccountBtn");

    const verifyRegisterBtn =
        document.getElementById("verifyRegisterBtn");

    const resendRegisterBtn =
        document.getElementById("resendRegisterBtn");

    const loginPasswordToggle =
        document.querySelector(
            '#loginForm .password-toggle'
        );

    const registerPasswordToggle =
        document.querySelector(
            '#registerForm .password-toggle'
        );

    /* LOGIN / REGISTER */

    if(loginTab){
        loginTab.onclick = showLogin;
    }

    if(registerTab){
        registerTab.onclick = showRegister;
    }


    /* EMAIL / PHONE */

    if(emailType){
        emailType.onclick = emailLogin;
    }

    if(phoneType){
        phoneType.onclick = phoneLogin;
    }


    /* LOGIN OTP */

    if(sendOtpBtn){
        sendOtpBtn.onclick = sendEmailOTP;
    }

    if(verifyOtpBtn){
        verifyOtpBtn.onclick = verifyEmailOTP;
    }


    /* REGISTER */

    if(createAccountBtn){
        createAccountBtn.onclick = registerUser;
    }

    if(verifyRegisterBtn){
        verifyRegisterBtn.onclick =
            verifyRegisterOTP;
    }

    if(resendRegisterBtn){
        resendRegisterBtn.onclick =
            resendRegisterOTP;
    }


    /* PASSWORD TOGGLE */

    if(loginPasswordToggle){

        loginPasswordToggle.onclick = function(){

            togglePassword(
                "loginPassword",
                this
            );

        };

    }

    if(registerPasswordToggle){

        registerPasswordToggle.onclick = function(){

            togglePassword(
                "registerPassword",
                this
            );

        };

    }


    /* LOGIN SECURELY */

    const passwordLoginBtn =
        document.querySelector(
            '#loginForm .main-btn:last-child'
        );

    if(passwordLoginBtn){

        passwordLoginBtn.onclick =
            passwordLoginNotice;

    }


    /* LOGIN OTP AUTO VERIFY */

    const loginOtp =
        document.getElementById("emailOTP");

    if(loginOtp){

        loginOtp.oninput = function(){

            this.value =
                this.value
                    .replace(/\D/g,"")
                    .slice(0,6);

            if(this.value.length === 6){

                setTimeout(
                    verifyEmailOTP,
                    180
                );

            }

        };

    }


    /* REGISTER OTP */

    const registerOtp =
        document.getElementById("registerOTP");

    if(registerOtp){

        registerOtp.oninput = function(){

            this.value =
                this.value
                    .replace(/\D/g,"")
                    .slice(0,6);

        };

    }

}


/* ENTER KEY */

document.onkeydown = (event) => {

    if(event.key !== "Enter") return;

    const active =
        document.activeElement;


    if(
        active ===
        document.getElementById("loginEmail")
    ){

        sendEmailOTP();

    }

    else if(
        active ===
        document.getElementById("emailOTP")
    ){

        verifyEmailOTP();

    }

    else if(
        active ===
        document.getElementById("registerOTP")
    ){

        verifyRegisterOTP();

    }

};


/* INITIALIZE NOW */

initializeUI();


/* ALSO RE-INITIALIZE AFTER PAGE RESTORE */

window.addEventListener(
    "pageshow",
    () => {
        initializeUI();
    }
);

/* =========================================================
   MOUSE PARALLAX
   Desktop only
========================================================= */

const authCard =
    document.getElementById(
        "authCard"
    );

const mainContainer =
    document.getElementById(
        "mainContainer"
    );


if(
    window.matchMedia(
        "(pointer:fine)"
    ).matches
){

    document.addEventListener(
        "mousemove",
        (event) => {

            const x =
                (
                    event.clientX /
                    window.innerWidth
                ) - .5;

            const y =
                (
                    event.clientY /
                    window.innerHeight
                ) - .5;


            authCard.style.transform = `

                perspective(1200px)

                rotateX(${(-y * 2.2).toFixed(2)}deg)

                rotateY(${(x * 2.2).toFixed(2)}deg)

            `;

        }
    );


    document.addEventListener(
        "mouseleave",
        () => {

            authCard.style.transform =
                "perspective(1200px) rotateX(0deg) rotateY(0deg)";

        }
    );
}

</script>
